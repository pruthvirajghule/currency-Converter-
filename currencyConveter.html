<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currency Converter</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

  body {
    margin: 0;
    height: 100vh;
    font-family: "Poppins", sans-serif;
    background: var(--bg);
    background-size: 400% 400%;
    animation: gradient 10s ease infinite;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.4s ease;
  }

  @keyframes gradient {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }

  .glass-card {
    width: 380px;
    padding: 25px;
    border-radius: 25px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0% {transform: scale(0.8); opacity: 0;}
    100% {transform: scale(1); opacity: 1;}
  }

  h2 {
    text-align: center;
    color: var(--neon2);
    text-shadow: 0 0 15px var(--neon2);
    margin-bottom: 20px;
  }

  .input-box, .dropdown {
    margin-top: 12px;
  }

  input, select {
    width: 100%;
    padding: 14px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
    color: var(--text);
    border-radius: 12px;
    backdrop-filter: blur(5px);
    transition: 0.3s ease;
  }

  input:focus, select:focus {
    border-color: var(--neon2);
    box-shadow: 0 0 12px var(--neon2);
  }

  option {
    background: #222;
    color: #fff;
  }

  .swap-btn {
    margin-top: 10px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    color: var(--text);
    transition: 0.3s ease;
  }

  .swap-btn:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.25);
  }

  .convert-btn {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: var(--neon);
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: 0.3s ease;
    box-shadow: 0 0 15px var(--neon);
  }

  .convert-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px var(--neon);
  }

  #result {
    margin-top: 18px;
    padding: 15px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    text-align: center;
    font-size: 20px;
    box-shadow: inset 0 0 15px rgba(255,255,255,0.2);
    display: none;
    animation: fadeUp 0.5s;
  }

  @keyframes fadeUp {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  .toggle-mode {
    position: absolute;
    top: 22px;
    right: 20px;
    padding: 10px 18px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    cursor: pointer;
    color: var(--text);
    backdrop-filter: blur(5px);
  }

  .loader {
    width: 45px;
    height: 45px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid var(--neon);
    border-radius: 50%;
    margin: 15px auto;
    display: none;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

</style>
</head>

<body>

<button class="toggle-mode" onclick="toggleMode()">🌙</button>

<div class="glass-card">

  <h2>Neon Currency Converter</h2>

  <input type="number" id="amount" class="input-box" placeholder="Enter amount">

  <select id="from"></select>
  <button class="swap-btn" onclick="swapCurrencies()">⇆ Swap</button>
  <select id="to"></select>

  <button class="convert-btn" onclick="convert()">Convert</button>

  <div id="loader" class="loader"></div>

  <div id="result"></div>
</div>

<script>
  const currencyList = {
    USD: "🇺🇸 USD – US Dollar",
    INR: "🇮🇳 INR – Indian Rupee",
    EUR: "🇪🇺 EUR – Euro",
    GBP: "🇬🇧 GBP – British Pound",
    JPY: "🇯🇵 JPY – Yen",
    CAD: "🇨🇦 CAD – Canadian Dollar",
    AUD: "🇦🇺 AUD – Australian Dollar",
    CHF: "🇨🇭 CHF – Swiss Franc",
    CNY: "🇨🇳 CNY – Chinese Yuan",
    AED: "🇦🇪 AED – UAE Dirham"
  };

  const fromSel = document.getElementById("from");
  const toSel = document.getElementById("to");

  Object.keys(currencyList).forEach(cur => {
    fromSel.innerHTML += `<option value="${cur}">${currencyList[cur]}</option>`;
    toSel.innerHTML += `<option value="${cur}">${currencyList[cur]}</option>`;
  });

  fromSel.value = "INR";
  toSel.value = "USD";

  function swapCurrencies() {
    let temp = fromSel.value;
    fromSel.value = toSel.value;
    toSel.value = temp;
  }

  async function convert() {
    const amount = document.getElementById("amount").value;
    const from = fromSel.value;
    const to = toSel.value;

    if (!amount || amount <= 0) {
      alert("Enter a valid amount!");
      return;
    }

    const loader = document.getElementById("loader");
    const resultBox = document.getElementById("result");

    loader.style.display = "block";
    resultBox.style.display = "none";

    const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
    const data = await res.json();

    loader.style.display = "none";

    const rate = data.rates[to];
    const converted = (amount * rate).toFixed(2);

    resultBox.style.display = "block";
    resultBox.innerHTML = `
      <b>${amount} ${from} = ${converted} ${to}</b><br>
      <small>Rate: 1 ${from} = ${rate.toFixed(4)} ${to}</small>
    `;
  }

  function toggleMode() {
    document.body.classList.toggle("light");
    localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
    document.querySelector(".toggle-mode").innerHTML =
      document.body.classList.contains("light") ? "🌙" : "☀️";
  }

  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
    document.querySelector(".toggle-mode").innerHTML = "🌙";
  }
</script>

</body>
</html>
